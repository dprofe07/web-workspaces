<!DOCTYPE html>
<html>
<head>
    <title>Workspace {{ code }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 25%;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 10px;
            overflow-y: auto;
        }
        .content {
            width: 75%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .site-item {
            padding: 8px;
            margin: 5px 0;
            background: white;
            border: 1px solid #ddd;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .site-item:hover {
            background: #e9e9e9;
        }
        .controls {
            margin-bottom: 15px;
        }
        input, button {
            padding: 5px;
            margin: 2px;
            width: 100%;
            box-sizing: border-box;
        }
        .delete-btn {
            color: red;
            cursor: pointer;
            margin-left: 10px;
        }
        .move-up-down-button {
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Workspace: {{ code }}</h3>

            <div class="controls">
                <input type="text" id="siteName" placeholder="Имя сайта">
                <input type="text" id="siteUrl" placeholder="https://example.com">
                <button onclick="addSite()">Add Site</button>
            </div>

            <div id="sitesList">
                {% for site in sites %}
                <div class="site-item" data-index="{{ loop.index0 }}">
                    <span onclick="loadSite('{{ site.url }}')">{{ site.name }}</span>
                    <span class="move-up-down-btn" onclick="moveSiteUp({{ loop.index0 }})">△▲▴▵</span>
                    <span class="move-up-down-btn" onclick="moveSiteDown({{ loop.index0 }})">▽▼▿▾</span>
                    <span class="delete-btn" onclick="deleteSite({{ loop.index0 }})">×</span>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="content">
            <iframe id="contentFrame" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        let currentEditIndex = -1;

        function addSite() {
            const name = document.getElementById('siteName').value.trim();
            const url = document.getElementById('siteUrl').value.trim();

            if (name && url) {
                fetch(
                    `{{ url_for('app.add_site', code=code) }}?name=${encodeURIComponent(name)}&url=${encodeURIComponent(url)}`
                ).then(() => location.reload());
            }
        }

        function deleteSite(index) {
            if (confirm('Delete this site?')) {
                fetch(`{{ url_for('app.remove_site', code=code) }}?index=${index}`)
                    .then(() => location.reload());
            }
        }

        function moveSiteDown(index) {
            fetch(`{{ url_for('app.move_site_down', code=code) }}?index=${index}`)
                .then(() => location.reload());
        }

        function moveSiteUp(index) {
            fetch(`{{ url_for('app.move_site_up', code=code) }}?index=${index}`)
                .then(() => location.reload());
        }

        function loadSite(url) {
            document.getElementById('contentFrame').src = url;
        }

        document.getElementById('siteUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addSite();
        });

        // Load first site if available
        {% if sites %}
            document.getElementById('contentFrame').src = '{{ sites[0].url }}';
        {% endif %}
    </script>
</body>
</html>
